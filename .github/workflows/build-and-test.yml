name: Build & Test

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  PHP_VERSION: 7.4
  WORDPRESS_VERSION: 6.0

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mysqli, curl, gd, mbstring
          tools: composer
      
      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress
          npm install --legacy-peer-deps
      
      - name: PHP Lint
        run: |
          find . -name "*.php" \
            ! -path "./vendor/*" \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            -exec php -l {} \; | \
            grep -v "No syntax errors" && exit 1 || exit 0
      
      - name: PHPCS (WordPress Coding Standards)
        run: |
          ./vendor/bin/phpcs --standard=WordPress --extensions=php \
            --ignore=vendor,node_modules \
            themisdb-support-portal/includes/ \
            themisdb-order-request/includes/ \
            themisdb-license-manager/includes/ || true
      
      - name: PHPUnit Tests
        run: |
          ./vendor/bin/phpunit --configuration phpunit.xml || true
      
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  build-artifacts:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Extract version from tag
        id: version
        run: |
          TAG=${{ github.ref }}
          VERSION=${TAG#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building artifacts for v$VERSION"
      
      - name: Update update-info.json for all plugins
        run: |
          VERSION=${{ steps.version.outputs.version }}
          for plugin in themisdb-support-portal themisdb-order-request themisdb-license-manager; do
            JSON_FILE="$plugin/update-info.json"
            if [ -f "$JSON_FILE" ]; then
              # Update version field in update-info.json
              jq ".version = \"$VERSION\"" "$JSON_FILE" > "${JSON_FILE}.tmp" && mv "${JSON_FILE}.tmp" "$JSON_FILE"
              echo "Updated $JSON_FILE to v$VERSION"
            fi
          done
      
      - name: Commit updated update-info.json files
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add "*/update-info.json" 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore(release): bump update-info.json to v${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:main || true
      
      - name: Build plugin ZIPs
        run: |
          mkdir -p build/
          VERSION=${{ steps.version.outputs.version }}
          for plugin in themisdb-support-portal themisdb-order-request themisdb-license-manager; do
            if [ -d "$plugin" ]; then
              echo "Building $plugin..."
              cd "$plugin"
              zip -r "../build/${plugin}-${VERSION}.zip" . \
                -x "*/.*" "*/tests/*" "*/node_modules/*" "*/.git/*" "*.sh"
              cd ..
              
              # Generate SHA256
              sha256sum "build/${plugin}-${VERSION}.zip" > "build/${plugin}-${VERSION}.zip.sha256"
              echo "Built: build/${plugin}-${VERSION}.zip"
            fi
          done
          ls -la build/
      
      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ## ThemisDB Plugin Release v${{ steps.version.outputs.version }}
            
            ### Downloads
            
            | Plugin | ZIP | SHA256 |
            |--------|-----|--------|
            | ThemisDB Order Request | [ZIP](https://github.com/makr-code/wordpressPlugins/releases/download/v${{ steps.version.outputs.version }}/themisdb-order-request-${{ steps.version.outputs.version }}.zip) | [SHA256](https://github.com/makr-code/wordpressPlugins/releases/download/v${{ steps.version.outputs.version }}/themisdb-order-request-${{ steps.version.outputs.version }}.zip.sha256) |
            | ThemisDB Support Portal | [ZIP](https://github.com/makr-code/wordpressPlugins/releases/download/v${{ steps.version.outputs.version }}/themisdb-support-portal-${{ steps.version.outputs.version }}.zip) | [SHA256](https://github.com/makr-code/wordpressPlugins/releases/download/v${{ steps.version.outputs.version }}/themisdb-support-portal-${{ steps.version.outputs.version }}.zip.sha256) |
            
            ### Installation
            1. Download the plugin ZIP
            2. Upload to WordPress: Plugins → Add New → Upload Plugin
            3. Activate plugin
            4. Configure license key
            
            ### Auto-Update
            Active licenses receive updates automatically via WordPress Plugin Updates.
            
            ### Verify Integrity
            ```bash
            sha256sum -c themisdb-order-request-${{ steps.version.outputs.version }}.zip.sha256
            ```
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-beta') || contains(steps.version.outputs.version, '-rc') || contains(steps.version.outputs.version, '-alpha') }}
          files: |
            build/*.zip
            build/*.sha256
      
      - name: Summary
        run: |
          echo "=== Release Summary ==="
          echo "Version: v${{ steps.version.outputs.version }}"
          echo "Artifacts:"
          ls -lh build/*.zip 2>/dev/null || echo "(none)"
          echo "========================"
