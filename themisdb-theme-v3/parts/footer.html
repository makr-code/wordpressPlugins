    <!-- wp:group {"layout":{"type":"flex","justifyContent":"space-between","verticalAlignment":"center","flexWrap":"wrap"},"style":{"spacing":{"blockGap":"var:preset|spacing|4"}}} -->
    <div class="wp-block-group">
        <!-- wp:group {"layout":{"type":"flex","orientation":"vertical"},"style":{"spacing":{"blockGap":"0.2rem"}}} -->
        <div class="wp-block-group">
            <!-- wp:site-title {"level":0,"fontSize":"small"} /-->
            <!-- wp:site-tagline {"fontSize":"small"} /-->
            <!-- wp:html -->
            <div class="tv3-footer-meta">
                <a class="tv3-footer-pill" href="https://github.com/makr-code/wordpressPlugins" target="_blank" rel="noopener noreferrer">
                    <span class="tv3-icon-inline" aria-hidden="true">

                    <span>GitHub</span>
                </a>
                <span class="tv3-footer-pill">
                    <span class="tv3-icon-inline" aria-hidden="true">
                        <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M12 2.75a.75.75 0 0 1 .75.75v1.02a7.5 7.5 0 0 1 6.73 6.73h1.02a.75.75 0 0 1 0 1.5h-1.02a7.5 7.5 0 0 1-6.73 6.73v1.02a.75.75 0 0 1-1.5 0v-1.02a7.5 7.5 0 0 1-6.73-6.73H3.5a.75.75 0 0 1 0-1.5h1.02a7.5 7.5 0 0 1 6.73-6.73V3.5a.75.75 0 0 1 .75-.75Zm0 3.25a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>
                    </span>
                    <span>Open Source</span>
                </span>
                <label class="tv3-layout-switcher" for="tv3-layout-switch">
                    <span>Karten-Layout</span>
                    <select id="tv3-layout-switch" aria-label="Card Layout umschalten">
                        <option value="tv3-layout-editorial">Editorial</option>
                        <option value="tv3-layout-editorial-tight">Editorial Tight</option>
                        <option value="tv3-layout-masonry-lite">Masonry Lite</option>
                    </select>
                </label>
                <label class="tv3-color-switcher" for="tv3-color-switch">
                    <span>Farbschema</span>
                    <select id="tv3-color-switch" aria-label="Farbschema umschalten">
                        <option value="tv3-scheme-modern-slate">Modern Slate</option>
                        <option value="tv3-scheme-themis-original">Themis Original</option>
                        <option value="tv3-scheme-ocean-clean">Ocean Clean</option>
                        <option value="tv3-scheme-charcoal-cyan">Charcoal Cyan</option>
                        <option value="tv3-scheme-paper-editorial">Paper Editorial</option>
                        <option value="tv3-scheme-high-contrast-clean">High Contrast Clean</option>
                    </select>
                </label>
                <label class="tv3-motion-switcher" for="tv3-motion-switch">
                    <span>Animation</span>
                    <select id="tv3-motion-switch" aria-label="Animationsprofil umschalten">
                        <option value="tv3-motion-calm">Ruhig</option>
                        <option value="tv3-motion-dynamic">Dynamisch</option>
                        <option value="tv3-motion-reduced">Reduziert</option>
                    </select>
                </label>
            </div>
            <script>
            (function () {
                var layoutSwitcher = document.getElementById('tv3-layout-switch');
                var colorSwitcher = document.getElementById('tv3-color-switch');
                var motionSwitcher = document.getElementById('tv3-motion-switch');
                var target = document.querySelector('.tv3-front-main');
                var body = document.body;

                var layoutStorageKey = 'tv3FrontLayout';
                var schemeStorageKey = 'tv3ColorScheme';
                var schemeCookieKey = 'tv3ColorScheme';
                var motionStorageKey = 'tv3MotionProfile';
                var allowedLayouts = ['tv3-layout-editorial', 'tv3-layout-editorial-tight', 'tv3-layout-masonry-lite'];
                var allowedSchemes = ['tv3-scheme-modern-slate', 'tv3-scheme-themis-original', 'tv3-scheme-ocean-clean', 'tv3-scheme-charcoal-cyan', 'tv3-scheme-paper-editorial', 'tv3-scheme-high-contrast-clean'];
                var allowedMotionProfiles = ['tv3-motion-calm', 'tv3-motion-dynamic', 'tv3-motion-reduced'];

                if (motionSwitcher && body) {
                    var currentMotionProfile = allowedMotionProfiles.find(function (name) {
                        return body.classList.contains(name);
                    }) || 'tv3-motion-calm';

                    var savedMotionProfile = null;
                    try {
                        savedMotionProfile = window.localStorage ? localStorage.getItem(motionStorageKey) : null;
                    } catch (err) {
                        savedMotionProfile = null;
                    }

                    function applyMotionProfile(profile) {
                        allowedMotionProfiles.forEach(function (name) {
                            body.classList.remove(name);
                        });
                        body.classList.add(profile);
                        motionSwitcher.value = profile;
                    }

                    if (savedMotionProfile && allowedMotionProfiles.indexOf(savedMotionProfile) !== -1) {
                        applyMotionProfile(savedMotionProfile);
                    } else if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                        applyMotionProfile('tv3-motion-reduced');
                    } else {
                        applyMotionProfile(currentMotionProfile);
                    }

                    motionSwitcher.addEventListener('change', function (event) {
                        var profile = event.target.value;
                        if (allowedMotionProfiles.indexOf(profile) === -1) {
                            return;
                        }
                        applyMotionProfile(profile);
                        try {
                            if (window.localStorage) {
                                localStorage.setItem(motionStorageKey, profile);
                            }
                        } catch (err) {
                        }
                    });
                }

                if (colorSwitcher && body) {
                    var currentScheme = allowedSchemes.find(function (name) {
                        return body.classList.contains(name);
                    }) || 'tv3-scheme-modern-slate';

                    var savedScheme = null;
                    try {
                        savedScheme = window.localStorage ? localStorage.getItem(schemeStorageKey) : null;
                    } catch (err) {
                        savedScheme = null;
                    }

                    function applyScheme(scheme) {
                        allowedSchemes.forEach(function (name) {
                            body.classList.remove(name);
                        });
                        body.classList.add(scheme);
                        colorSwitcher.value = scheme;
                    }

                    if (savedScheme && allowedSchemes.indexOf(savedScheme) !== -1) {
                        applyScheme(savedScheme);
                    } else {
                        applyScheme(currentScheme);
                    }

                    colorSwitcher.addEventListener('change', function (event) {
                        var scheme = event.target.value;
                        if (allowedSchemes.indexOf(scheme) === -1) {
                            return;
                        }
                        applyScheme(scheme);
                        try {
                            if (window.localStorage) {
                                localStorage.setItem(schemeStorageKey, scheme);
                            }
                        } catch (err) {
                        }
                        try {
                            document.cookie = schemeCookieKey + '=' + encodeURIComponent(scheme) + ';path=/;max-age=31536000;samesite=lax';
                        } catch (err) {
                        }
                    });
                }

                if (!layoutSwitcher) {
                    return;
                }

                if (!target) {
                    layoutSwitcher.disabled = true;
                    layoutSwitcher.title = 'Nur auf der Startseite verfuegbar';
                    return;
                }

                var currentLayout = allowedLayouts.find(function (name) {
                    return target.classList.contains(name);
                }) || 'tv3-layout-editorial';

                var savedLayout = null;
                try {
                    savedLayout = window.localStorage ? localStorage.getItem(layoutStorageKey) : null;
                } catch (err) {
                    savedLayout = null;
                }

                function applyLayout(layout) {
                    allowedLayouts.forEach(function (name) {
                        target.classList.remove(name);
                    });
                    target.classList.add(layout);
                    layoutSwitcher.value = layout;
                }

                if (savedLayout && allowedLayouts.indexOf(savedLayout) !== -1) {
                    applyLayout(savedLayout);
                } else {
                    applyLayout(currentLayout);
                }

                layoutSwitcher.addEventListener('change', function (event) {
                    var layout = event.target.value;
                    if (allowedLayouts.indexOf(layout) === -1) {
                        return;
                    }
                    applyLayout(layout);
                    try {
                        if (window.localStorage) {
                            localStorage.setItem(layoutStorageKey, layout);
                        }
                    } catch (err) {
                    }
                });

                var siteTitleLink = document.querySelector('.wp-block-site-title a');
                var frontUrl = siteTitleLink ? siteTitleLink.href : '/';
                var navLinks = document.querySelectorAll('.tv3-header-nav a[href]');

                function isSameHost(url) {
                    try {
                        return url.host === window.location.host;
                    } catch (err) {
                        return false;
                    }
                }

                function shouldSkipNavFilter(link, url) {
                    if (!link || !url) {
                        return true;
                    }
                    if (link.target === '_blank') {
                        return true;
                    }
                    if (!isSameHost(url)) {
                        return true;
                    }
                    if (url.hash && url.pathname === window.location.pathname) {
                        return true;
                    }
                    if (url.pathname.indexOf('/wp-admin/') !== -1 || url.pathname.indexOf('/wp-login.php') !== -1) {
                        return true;
                    }
                    if (url.pathname === '/docs' || url.pathname === '/docs/') {
                        return true;
                    }
                    return false;
                }

                function keywordFromLink(link, url) {
                    var fromPath = '';
                    try {
                        var segments = url.pathname.split('/').filter(Boolean);
                        fromPath = segments.length ? segments[segments.length - 1] : '';
                    } catch (err) {
                        fromPath = '';
                    }

                    if (fromPath) {
                        return decodeURIComponent(fromPath).replace(/[-_]+/g, ' ').trim();
                    }

                    return (link.textContent || '').replace(/\s+/g, ' ').trim();
                }

                navLinks.forEach(function (link) {
                    var href = link.getAttribute('href');
                    if (!href) {
                        return;
                    }

                    var linkUrl;
                    try {
                        linkUrl = new URL(href, window.location.origin);
                    } catch (err) {
                        return;
                    }

                    if (shouldSkipNavFilter(link, linkUrl)) {
                        return;
                    }

                    link.addEventListener('click', function (event) {
                        event.preventDefault();

                        var keyword = keywordFromLink(link, linkUrl);
                        var destination = new URL(frontUrl, window.location.origin);

                        if (keyword && keyword.toLowerCase() !== 'home') {
                            destination.searchParams.set('tv3_search', keyword);
                        }

                        window.location.href = destination.toString();
                    });
                });
            })();
            </script>
            <!-- /wp:html -->
        </div>
