<!DOCTYPE html>
<html>
<head>
    <title>Breadcrumb Links Test</title>
</head>
<body>
    <h1>Breadcrumb Links Inspector</h1>
    <iframe id="frame" src="http://localhost/wordpress/" style="width: 100%; height: 100vh; border: none;"></iframe>
    <script>
        // Wait for iframe to load
        setTimeout(() => {
            try {
                const frame = document.getElementById('frame');
                const doc = frame.contentDocument || frame.contentWindow.document;
                const links = doc.querySelectorAll('.tv3-breadcrumbs-item a');
                console.log('Found breadcrumb links:');
                links.forEach(link => {
                    console.log(`${link.textContent.trim()}: ${link.getAttribute('href')}`);
                });
            } catch (e) {
                console.error('Error accessing iframe:', e.message);
            }
        }, 3000);
    </script>
</body>
</html>
